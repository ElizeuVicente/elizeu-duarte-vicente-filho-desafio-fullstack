services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notes_db
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - notes_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notes_db_data:
